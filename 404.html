<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>Page Not Found | Gratitude</title>
    <meta
      name="description"
      content="The page you requested could not be found. Return to Gratitude or explore positive affirmations."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #282128; background: #fffaf6; font-family: "Inter", sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
      .not-found { width: min(100%, 680px); padding: 56px 40px; background: #fff; border: 1px solid #eadfda; border-radius: 28px; box-shadow: 0 18px 55px rgba(80, 55, 65, .1); text-align: center; }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: inherit; font-size: 20px; font-weight: 800; text-decoration: none; }
      .brand img { width: 48px; height: 48px; }
      .code { margin: 32px 0 8px; color: #b94464; font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; color: #211d20; font-size: clamp(38px, 7vw, 58px); line-height: 1.1; letter-spacing: -.04em; }
      p { max-width: 520px; margin: 18px auto 0; color: #746b72; font-size: 17px; line-height: 1.65; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
      .actions a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border: 1px solid #f1cad4; border-radius: 999px; color: #b94464; background: #fff0f3; font-weight: 700; text-decoration: none; }
      .actions a:first-child { color: #fff; background: #fe678b; border-color: #fe678b; }
      .actions a:focus-visible { outline: 3px solid rgba(185, 68, 100, .28); outline-offset: 3px; }
      @media (max-width: 520px) { .not-found { padding: 42px 22px; } .actions { display: grid; } .actions a { justify-content: center; } }
    </style>
  </head>
  <body>
    <main>
      <section class="not-found" aria-labelledby="not-found-title">
        <a class="brand" href="/" aria-label="Gratitude home">
          <img src="/images/footer-logo.png" alt="" width="60" height="60" />
          <span>Gratitude</span>
        </a>
        <p class="code">404 · Page not found</p>
        <h1 id="not-found-title">This page took a mindful pause.</h1>
        <p>The page may have moved or no longer exists. You can return home or continue with the affirmation library.</p>
        <nav class="actions" aria-label="Page recovery">
          <a href="/">Return home</a>
          <a href="/affirmations/">Explore affirmations</a>
          <a href="/app/">Get the app</a>
        </nav>
      </section>
    </main>
  </body>
</html>
