<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Gratitude</title>
  <meta name="description" content="Open the Gratitude app or download it from the App Store or Google Play.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#fff9f4">
  <meta name="apple-itunes-app" content="app-id=1372575227">
  <link rel="canonical" href="https://www.gratefulness.me/app">
  <link rel="icon" href="/favicon.png">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5B0WGJZT0D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-5B0WGJZT0D");
  </script>
  <style>
    :root {
      color-scheme: light;
      --ink: #332c2a;
      --muted: #6f6460;
      --surface: #fffdfb;
      --accent: #ef6c57;
      --ring: rgba(239, 108, 87, .3);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 8%, rgba(255, 218, 193, .72), transparent 34%),
        radial-gradient(circle at 82% 88%, rgba(247, 199, 201, .58), transparent 36%),
        #fff9f4;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 540px);
      padding: 40px 28px 34px;
      text-align: center;
      background: rgba(255, 253, 251, .92);
      border: 1px solid rgba(82, 61, 54, .1);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(89, 61, 52, .13);
      backdrop-filter: blur(12px);
    }
    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 12px 26px rgba(82, 61, 54, .16);
    }
    h1 {
      margin: 22px 0 10px;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.04;
      letter-spacing: -.04em;
    }
    p {
      margin: 0 auto;
      max-width: 410px;
      color: var(--muted);
      font-size: 1.06rem;
      line-height: 1.6;
    }
    #status {
      min-height: 26px;
      margin-top: 14px;
      font-size: .94rem;
    }
    .stores {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }
    .store-link {
      display: inline-flex;
      min-height: 52px;
      border-radius: 10px;
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .store-link:hover { transform: translateY(-2px); }
    .store-link:focus-visible {
      outline: 4px solid var(--ring);
      outline-offset: 3px;
    }
    .store-link img {
      display: block;
      width: auto;
      height: 52px;
    }
    .fallback {
      margin-top: 24px;
      font-size: .84rem;
    }
    .fallback a { color: var(--accent); }
    @media (max-width: 420px) {
      main { padding: 34px 20px 28px; border-radius: 24px; }
      .stores { flex-direction: column; align-items: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .store-link { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="app-icon" src="/favicon.png" alt="">
    <h1>Open Gratitude</h1>
    <p>Journal, affirm, and build a happier life—one grateful moment at a time.</p>
    <p id="status" role="status" aria-live="polite">Choose your app store to continue.</p>
    <div class="stores">
      <a class="store-link" id="ios-link" href="https://apps.apple.com/app/id1372575227" aria-label="Download Gratitude on the App Store">
        <img src="/images/app-store.svg" alt="Download on the App Store">
      </a>
      <a class="store-link" id="android-link" href="https://play.google.com/store/apps/details?id=com.northstar.gratitude" aria-label="Get Gratitude on Google Play">
        <img src="/images/google-play.svg" alt="Get it on Google Play">
      </a>
    </div>
    <p class="fallback">Not redirected? Use one of the buttons above or visit <a href="https://www.gratefulness.me/">gratefulness.me</a>.</p>
  </main>
  <script>
    (function () {
      var IOS_URL = "https://apps.apple.com/app/id1372575227";
      var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.northstar.gratitude";
      var sourceParams = new URLSearchParams(window.location.search);
      var playReferrer = new URLSearchParams();

      ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content"].forEach(function (key) {
        if (sourceParams.has(key)) playReferrer.set(key, sourceParams.get(key));
      });

      var referrerValue = playReferrer.toString();
      var androidDestination = ANDROID_URL + (referrerValue ? "&referrer=" + encodeURIComponent(referrerValue) : "");
      var iosLink = document.getElementById("ios-link");
      var androidLink = document.getElementById("android-link");
      var status = document.getElementById("status");
      androidLink.href = androidDestination;

      var userAgent = navigator.userAgent || "";
      var isAndroid = /Android/i.test(userAgent);
      var isIOS = /iPad|iPhone|iPod/.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      function trackAndOpen(platform, destination, autoRedirect) {
        var opened = false;
        function openStore() {
          if (opened) return;
          opened = true;
          window.location.replace(destination);
        }

        if (typeof window.gtag === "function") {
          window.gtag("event", "app_store_click", {
            platform: platform,
            redirect_type: autoRedirect ? "automatic" : "manual",
            link_url: destination,
            transport_type: "beacon",
            event_callback: openStore
          });
        }
        window.setTimeout(openStore, autoRedirect ? 700 : 180);
      }

      iosLink.addEventListener("click", function (event) {
        event.preventDefault();
        trackAndOpen("ios", IOS_URL, false);
      });

      androidLink.addEventListener("click", function (event) {
        event.preventDefault();
        trackAndOpen("android", androidDestination, false);
      });

      if (isIOS || isAndroid) {
        var platform = isIOS ? "ios" : "android";
        var destination = isIOS ? IOS_URL : androidDestination;
        status.textContent = "Opening " + (isIOS ? "the App Store" : "Google Play") + "…";
        trackAndOpen(platform, destination, true);
      }
    }());
  </script>
</body>
</html>
